# cargo-fuzz scaffold (s01). Standalone workspace — built by
# `cargo xtask fuzz-smoke` (and nightly CI), not by the main workspace.
# Adding a target: one [[bin]] block + one file in fuzz_targets/.

[package]
name = "wolf-fuzz"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
xtask = { path = "../xtask" }
wolf_lex = { path = "../crates/wolf_lex" }
wolf_span = { path = "../crates/wolf_span" }
wolf_ast = { path = "../crates/wolf_ast" }
wolf_parse = { path = "../crates/wolf_parse" }
wolf_fmt = { path = "../crates/wolf_fmt" }
wolf_wir = { path = "../crates/wolf_wir" }
wolf_backend = { path = "../crates/wolf_backend" }
wolf_codegen_llvm = { path = "../crates/wolf_codegen_llvm" }

[[bin]]
name = "fuzz_corpus_directives"
path = "fuzz_targets/fuzz_corpus_directives.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lex"
path = "fuzz_targets/lex.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_decls"
path = "fuzz_targets/parse_decls.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_mutated"
path = "fuzz_targets/parse_mutated.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fmt"
path = "fuzz_targets/fmt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wir_parse"
path = "fuzz_targets/wir_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "llvm_fact_emit"
path = "fuzz_targets/llvm_fact_emit.rs"
test = false
doc = false
bench = false

[workspace]
