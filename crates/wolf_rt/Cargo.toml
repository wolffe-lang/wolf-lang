[package]
name = "wolf_rt"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# `staticlib` (s28): compiled wolf programs link `libwolf_rt.a` — the
# driver's v0 link step finds it next to the `wolf` binary. `rlib`
# stays for the compiler-side users of the symbol/kind tables.
[lib]
crate-type = ["rlib", "staticlib"]

# D15: dependency-thin by law — no workspace crates above wolf_span,
# no heavy crates. `libc` is the contract's own "syscalls direct
# (libc-level)" posture (s32 Target 1): raw bindings only, nothing at
# runtime beyond the calls we make (mmap/madvise/pthread/sigaction for
# the pooled task stacks and the guard-page fault report).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Single-threaded-entry tests (s32 Target 1): the harness itself may
# not spawn threads before the assertion runs, so these bypass libtest.
[[test]]
name = "no_spawn"
harness = false

[[test]]
name = "stack_overflow"
harness = false

# The D15 io twin of no_spawn (s35): a no-io program carries no
# reactor thread; the assertion counts OS threads, so no libtest.
[[test]]
name = "no_io"
harness = false

[[test]]
name = "spawn_bench"
harness = false

[[test]]
name = "chan_bench"
harness = false

# Root-domain death calls process::exit ([conc.proc.root]) — the
# scenario re-execs itself as a child process, so no libtest harness.
[[test]]
name = "proc_root"
harness = false
