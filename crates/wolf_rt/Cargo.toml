[package]
name = "wolf_rt"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later WITH GCC-exception-3.1"
repository.workspace = true
rust-version.workspace = true

# `staticlib` (s28): compiled wolf programs link `libwolf_rt.a` — the
# driver's v0 link step finds it next to the `wolf` binary. `rlib`
# stays for the compiler-side users of the symbol/kind tables.
[lib]
crate-type = ["rlib", "staticlib"]

# s36 (X12/D15): `sched-test` compiles the schedule-point hooks and
# the deterministic test scheduler into the staticlib — the future
# debug-tier runtime build. DEFAULT OFF: the release staticlib carries
# no hook code (the D5 zero-cost gate measures this, never asserts it).
[features]
sched-test = []

# D15: dependency-thin by law — no workspace crates above wolf_span,
# no heavy crates. `libc` is the contract's own "syscalls direct
# (libc-level)" posture (s32 Target 1): raw bindings only, nothing at
# runtime beyond the calls we make (mmap/madvise/pthread/sigaction for
# the pooled task stacks and the guard-page fault report).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Single-threaded-entry tests (s32 Target 1): the harness itself may
# not spawn threads before the assertion runs, so these bypass libtest.
[[test]]
name = "no_spawn"
harness = false

[[test]]
name = "stack_overflow"
harness = false

# s265 (wolf-lang#918): the main thread's guard read cheaply at entry is
# the one pthread_getattr_np(3) reports — on the main thread, so no libtest.
[[test]]
name = "main_stack_bounds"
harness = false

# s149 (#289, #290): the linux syscall COUNT, read with the tracer
# lobo's ws27 counted with. `harness = false` because the child is
# this binary re-executed and the trace must hold its calls alone.
[[test]]
name = "syscall_shape"
harness = false

# The D15 io twin of no_spawn (s35): a no-io program carries no
# reactor thread; the assertion counts OS threads, so no libtest.
[[test]]
name = "no_io"
harness = false

# s239 (wolf-lang#750): the reactor at the descriptor limit — each case
# re-executes this binary and lowers its own child's limit, so no
# libtest (the reactor is one per process, made once).
[[test]]
name = "reactor_limit"
harness = false

[[test]]
name = "spawn_bench"
harness = false

[[test]]
name = "chan_bench"
harness = false

# Root-domain death calls process::exit ([conc.proc.root]) — the
# scenario re-execs itself as a child process, so no libtest harness.
[[test]]
name = "proc_root"
harness = false
