[package]
name = "wolf_driver"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "wolf"
path = "src/main.rs"

[dependencies]
wolf_span.workspace = true
wolf_diag.workspace = true
wolf_lex.workspace = true
wolf_parse.workspace = true
wolf_fmt.workspace = true
serde_json.workspace = true
wolf_sema.workspace = true
wolf_mem.workspace = true
wolf_wir.workspace = true
wolf_backend.workspace = true
wolf_codegen_clif.workspace = true
wolf_codegen_llvm.workspace = true
wolf_rt.workspace = true
wolf_query.workspace = true
wolf_lsp.workspace = true

[dev-dependencies]
# s30 debug tests: parse the built executable's ELF sections to assert
# .debug_* presence (the ledger's readelf-style check, tool-free).
object = { version = "0.39", default-features = false, features = ["read_core", "elf", "std"] }
