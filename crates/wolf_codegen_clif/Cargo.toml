[package]
name = "wolf_codegen_clif"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
wolf_wir.workspace = true
wolf_backend.workspace = true
wolf_rt.workspace = true
cranelift-codegen = "0.134"
cranelift-frontend = "0.134"
cranelift-module = "0.134"
cranelift-object = "0.134"
# Post-emit resolution of Mach-O debug-section addresses (s59): the
# Apple toolchain convention embeds RESOLVED object addresses in
# `__DWARF` (dsymutil ignores extern relocations there), so `finish`
# patches the emitted bytes through the read API. Same version cargo
# already unifies for cranelift-object.
object = { version = "0.39", default-features = false, features = ["read_core", "macho", "std"] }
target-lexicon = "0.13"

[dev-dependencies]
insta.workspace = true
