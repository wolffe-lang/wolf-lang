[package]
name = "wolf_wir"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# s24 kept wolf_wir on wolf_span alone; s25's builder consumes the
# typed HIR, so wolf_ast/wolf_sema (the input language) join here.
# The IR data model still re-declares its own vocabulary (facts.rs,
# types.rs) — sema/mem types cross only inside `lower`, never into the
# arenas, the ops, or the textual format.
wolf_span.workspace = true
wolf_ast.workspace = true
wolf_sema.workspace = true
# s89: the byte-view LEND analysis (`wolf_mem::byteview`) is the memory
# checker's, and lowering is its second consumer — the same verdict
# decides the W1004 diagnostic and whether a call site may pass a view
# instead of a copy. One authority, two readers; the alternative was
# two whitelists that could drift apart into unsoundness.
wolf_mem.workspace = true

[dev-dependencies]
insta.workspace = true
# The golden-corpus and determinism gates lower only mem-clean files,
# so the tests and the bench example (not the library) run the memory
# checker and filter diagnostics by severity.
wolf_diag.workspace = true
