# s230, TEMPORARY (removed before the head): the four-machine table of
# fs_change_lanes on macOS, strict (wolf-lang#571) — a sibling lupin
# required and built from wolf-interp's s230, every machine's stdout
# printed, any SKIP line a failure. The ordinary macOS jobs run the same
# gate without a sibling and hide a passing test's stderr, so they cannot
# show which lanes ran; this job can.
name: s230-evidence

on:
  pull_request:

permissions:
  contents: read

jobs:
  macos-four-machines:
    name: s230 fs_change_lanes, strict (macOS aarch64)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: the mirror lupin, from wolf-interp's s230
        run: |
          set -euo pipefail
          git clone --depth 1 -b s230 https://github.com/wolffe-lang/wolf-interp.git "$RUNNER_TEMP/wolf-interp"
          git -C "$RUNNER_TEMP/wolf-interp" rev-parse HEAD
          cargo build --release --manifest-path "$RUNNER_TEMP/wolf-interp/Cargo.toml"
          "$RUNNER_TEMP/wolf-interp/target/release/lupin" --version
      - name: wolf and its runtime archive
        run: |
          set -euo pipefail
          cargo build --release -p wolf_driver -p wolf_rt
          ls -la target/release/libwolf_rt.a
          sw_vers; uname -a; umask
      - name: the gate, strict, every machine's stdout printed
        env:
          WOLF_PAIRING_REQUIRE_SIBLING: "1"
        run: |
          set -uo pipefail
          export LUPIN="$RUNNER_TEMP/wolf-interp/target/release/lupin"
          cargo test --release -p wolf_driver --test fs_change_lanes -- --nocapture --test-threads=1 2>&1 | tee gate-macos.log
          rc=${PIPESTATUS[0]}
          echo "gate exit: $rc"
          echo "SKIP lines: $(grep -c SKIP gate-macos.log || true)"
          shasum -a 256 gate-macos.log
          if grep -n SKIP gate-macos.log; then echo "::error::a lane was skipped"; exit 1; fi
          exit "$rc"
      - name: the runtime's own tests, the umask's in their own process
        run: |
          set -euo pipefail
          cargo test --release -p wolf_rt --lib fs_change -- --nocapture
          cargo test --release -p wolf_rt --test umask -- --nocapture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s230-gate-macos
          path: gate-macos.log
          retention-days: 14
