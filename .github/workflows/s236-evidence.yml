# s236, TEMPORARY (removed before the head): the machine tables of
# ids_lanes on macOS and windows, strict (wolf-lang#571) — a sibling
# lupin required and built from wolf-interp's s236 (the mirror), every
# machine's stdout printed and every SKIP line counted. The ordinary
# macOS and windows jobs run the same gate without a sibling and hide a
# passing test's stderr, so they cannot show which machines ran, what
# was refused and what was skipped; these jobs can. Nothing here sets an
# id or changes an owner: these hosts run only the rows that change
# nothing (the container witnesses are linux's, in the linux job).
name: s236-evidence

on:
  pull_request:

permissions:
  contents: read

jobs:
  machines:
    name: s236 ids_lanes, every machine's stdout (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: the mirror lupin, from wolf-interp's s236
        run: |
          set -euo pipefail
          git clone --depth 1 -b s236 https://github.com/wolffe-lang/wolf-interp.git "$RUNNER_TEMP/wolf-interp"
          git -C "$RUNNER_TEMP/wolf-interp" rev-parse HEAD
          cargo build --release --manifest-path "$RUNNER_TEMP/wolf-interp/Cargo.toml"
          "$RUNNER_TEMP/wolf-interp/target/release/lupin" --version
      - name: wolf and its runtime archive
        run: |
          set -euo pipefail
          cargo build -p wolf_driver -p wolf_rt
          uname -a
          id || true
      - name: the gate, sibling required, every machine's stdout printed
        env:
          WOLF_PAIRING_REQUIRE_SIBLING: "1"
        run: |
          set -uo pipefail
          exe=""; case "$RUNNER_OS" in Windows) exe=".exe";; esac
          export LUPIN="$RUNNER_TEMP/wolf-interp/target/release/lupin$exe"
          cargo test -p wolf_driver --test ids_lanes -- --nocapture --test-threads=1 2>&1 | tee gate.log
          rc=${PIPESTATUS[0]}
          echo "gate exit: $rc"
          echo "SKIP lines: $(grep -c SKIP gate.log || true)"
          grep -n SKIP gate.log || true
          sha256sum gate.log 2>/dev/null || shasum -a 256 gate.log
          exit "$rc"
      - name: the runtime's own id tests
        run: cargo test -p wolf_rt --lib ids -- --nocapture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s236-gate-${{ matrix.os }}
          path: gate.log
          retention-days: 14
