# s60b — the windows task layer's probe: ONE run answers the whole
# windows table (the way of working s60a bound — a round is 10–20
# minutes, so never one question per push). Runs on every push to the
# s60b branch and on demand; prints the table under its own headings
# so the log reads top to bottom. Once the sprint is green its claims
# live in ci.yml's windows job and this file retires (the s60a
# precedent). Edited by literal rewrite only, parsed locally before
# every push — the standing law.
name: windows-probe

on:
  push:
    branches: [s60b]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PROPTEST_CASES: "64"

jobs:
  probe:
    name: windows table (x86-64, the task layer)
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: "T0 host: rustc, cores"
        run: |
          rustc -vV
          echo "cores: $NUMBER_OF_PROCESSORS"

      - name: "T1 build: workspace + wolf_rt.lib"
        run: |
          cargo build --workspace
          ls -la target/debug/wolf.exe target/debug/wolf_rt.lib

      - name: "T1 clippy: the windows lane is clippy-clean (its own step, so a lint never hides the table)"
        continue-on-error: true
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: "T1 stack overflow: a task overflows -> wolf's voice + exit 134 (the VEH); main-thread overflow in a no-spawn program -> the s60a gap, measured"
        run: |
          set +e
          mkdir -p probe/overflow_task probe/overflow_main
          cat > probe/overflow_task/main.lu <<'LU'
          fn deep(n: int) -> int {
              if n < 0 { 0 } else { deep(n + 1) + 1 }
          }

          fn main() -> int {
              scope s {
                  s.spawn(fn() {
                      let x = deep(0)
                      print("unreachable: {x}")
                  })
              }
              0
          }
          LU
          cat > probe/overflow_main/main.lu <<'LU'
          fn deep(n: int) -> int {
              if n < 0 { 0 } else { deep(n + 1) + 1 }
          }

          fn main() -> int {
              let x = deep(0)
              print("unreachable: {x}")
              0
          }
          LU
          echo "== task overflow (expect: wolf-rt: stack overflow in task 'main.task0.entry' / exit 134)"
          ./target/debug/wolf.exe build probe/overflow_task/main.lu -o overflow_task.exe && timeout 120 ./overflow_task.exe; echo "bash exit=$?"
          echo "== main-thread overflow, no spawn (expect: no wolf voice — STATUS_STACK_OVERFLOW 0xC00000FD = -1073741571; the D15 posture: no handler without a spawn)"
          ./target/debug/wolf.exe build probe/overflow_main/main.lu -o overflow_main.exe && timeout 120 ./overflow_main.exe; echo "bash exit=$?"
          true

      - name: "T2 os.signal: the two corpus rows on the native lane (the console-control mapping + the in-process loopback)"
        run: |
          set +e
          for f in corpus/os/signal_loopback.lu corpus/os/signal_supervisor.lu; do
            echo "== wolf conform-run --json --native $f"
            timeout 120 ./target/debug/wolf.exe conform-run "$f" --json --native; echo "exit=$? (124 = hung past 120s)"
          done
          true

      - name: "T3 reactor: the deadline row and the net rows on the native lane (WSAPoll behind the s35 seam)"
        run: |
          set +e
          for f in corpus/net/*.lu; do
            echo "== wolf conform-run --json --native $f"
            timeout 120 ./target/debug/wolf.exe conform-run "$f" --json --native; echo "exit=$? (124 = hung past 120s)"
          done
          true

      - name: "T3 measure: 24 tasks each parked on a 200ms read deadline — the reactor's wall clock under a corpus-shaped fan-in (WSAPoll vs IOCP, decided by this number)"
        run: |
          set +e
          mkdir -p probe/deadline_fanin
          cat > probe/deadline_fanin/main.lu <<'LU'
          fn main() -> !int {
              let srv = net_listen("127.0.0.1:0")?
              let port = net_port(srv)?
              let ch = channel[int](32)
              let t0 = time_now_ms()
              scope s {
                  for i in 1..=24 {
                      s.spawn(fn() {
                          let cli = net_connect("127.0.0.1:{port}") else |_| -1
                          net_deadline(cli, 200) else |_| print("arm failed")
                          let r = net_read(cli, 8) else |_| "T"
                          ch.send(if r == "T" { 1 } else { 0 })
                      })
                  }
              }
              var timeouts = 0
              for k in 1..=24 { timeouts += ch.recv()? }
              let dt = time_now_ms() - t0
              print("timeouts={timeouts}/24 wall_ms={dt}")
              0
          }
          LU
          ./target/debug/wolf.exe build probe/deadline_fanin/main.lu -o deadline_fanin.exe && timeout 120 ./deadline_fanin.exe; echo "exit=$?"
          true

      - name: "T4 corpus: lane-coverage --rows (per-row verdicts; the windows floor line)"
        timeout-minutes: 25
        run: cargo xtask lane-coverage --rows

      - name: "T4 corpus: xtask corpus (the ledger, as the unix lanes run it)"
        continue-on-error: true
        timeout-minutes: 20
        run: cargo xtask corpus 2>&1 | tail -60

      - name: "T5 dist: cargo xtask dist (archive + the unpacked-archive smoke)"
        run: cargo xtask dist

      - name: "T6 tests: cargo test --workspace (what the gate-open makes execute here; panics and failures kept loud)"
        continue-on-error: true
        timeout-minutes: 25
        run: |
          cargo test --workspace --no-fail-fast 2>&1 | grep -E -A10 "^(test result|test .*FAILED|---- |     Running|no_spawn:|no_io:|stack_overflow:|proc_root:|thread '.*panicked|error: test failed)" | grep -vE "^\s*$|^--$" | head -600
