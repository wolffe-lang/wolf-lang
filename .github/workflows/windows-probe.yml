# s60a — the windows native bring-up's probe: ONE run answers the whole
# windows table (the way of working the amended note binds — a round is
# 10–20 minutes, so never one question per push). Runs on every push to
# the bring-up branch and on demand; prints the table under its own
# headings so the log reads top to bottom. Once the bring-up is green
# its steps fold into ci.yml's windows job and this file retires.
name: windows-probe

on:
  push:
    branches: [s60a]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PROPTEST_CASES: "64"

jobs:
  probe:
    name: windows table (x86-64, native bring-up)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: "T0 host: what the runner has (linkers, SDK, rustc)"
        run: |
          echo "== rustc";   rustc -vV
          echo "== lld-link on PATH?"; (lld-link --version && echo FOUND) || echo "not on PATH"
          echo "== rust-lld"; ls "$(rustc --print sysroot)/lib/rustlib/x86_64-pc-windows-msvc/bin/" || true
          echo "== link.exe via vswhere"; "/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath || true
          echo "== LIB env: ${LIB:-<unset>}"

      - name: "T1 build: workspace + wolf_rt.lib"
        run: |
          cargo build --workspace
          ls -la target/debug/wolf.exe target/debug/wolf_rt.lib

      - name: "T1 clippy: the windows lane is clippy-clean too (its own step, so a lint never hides the table)"
        continue-on-error: true
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: "T1 hello: wolf build hello.lu -> hello.exe (verbose names the linker), run it"
        run: |
          echo "== wolf --version"; ./target/debug/wolf.exe --version
          echo "== wolf build --verbose corpus/hello.lu"
          ./target/debug/wolf.exe build --verbose corpus/hello.lu -o hello.exe
          ls -la hello.exe
          echo "== ./hello.exe"; ./hello.exe; echo "exit=$?"
          echo "== wolf run corpus/hello.lu"; ./target/debug/wolf.exe run corpus/hello.lu; echo "exit=$?"

      - name: "T1 linker order: each rung, forced (WOLF_LINKER, lld-link, rust-lld, link.exe)"
        run: |
          set +e
          echo "== rung 1: WOLF_LINKER pointed at the PATH lld-link (the explicit override)"
          if command -v lld-link >/dev/null; then
            WOLF_LINKER="$(command -v lld-link)" ./target/debug/wolf.exe build --verbose corpus/hello.lu -o hello-r1.exe && ./hello-r1.exe; echo "rung1(WOLF_LINKER=lld-link) exit=$?"
          fi
          echo "== rung 4 forced: WOLF_LINKER pointed at MSVC link.exe (link.exe dialect, no lld switches)"
          LINK_EXE="$(find '/c/Program Files/Microsoft Visual Studio' '/c/Program Files (x86)/Microsoft Visual Studio' -name link.exe -path '*Hostx64/x64*' 2>/dev/null | head -1)"
          echo "link.exe: ${LINK_EXE:-<none>}"
          if [ -n "$LINK_EXE" ]; then
            WOLF_LINKER="$LINK_EXE" ./target/debug/wolf.exe build --verbose corpus/hello.lu -o hello-r4.exe && ./hello-r4.exe; echo "rung4(WOLF_LINKER=link.exe) exit=$?"
          fi
          echo "== rung 3 forced: WOLF_LINKER=rust-lld (the -flavor link dialect)"
          WOLF_LINKER="$(rustc --print sysroot)/lib/rustlib/x86_64-pc-windows-msvc/bin/rust-lld.exe" ./target/debug/wolf.exe build --verbose corpus/hello.lu -o hello-r3f.exe && ./hello-r3f.exe; echo "rung3(WOLF_LINKER=rust-lld) exit=$?"
          echo "== rung 2b/3 by order: PATH holds rustc but no lld-link (the VS-bundled lld-link outranks rust-lld where VS has one)"
          env PATH="$(dirname "$(command -v rustc)"):/c/Windows/System32" ./target/debug/wolf.exe build --verbose corpus/hello.lu -o hello-r3.exe && ./hello-r3.exe; echo "rung3(rust-lld) exit=$?"
          echo "== rung 4 by discovery: a plain shell (PATH = System32 only: no lld-link, no rustc; LIB unset) — MSVC found by vswhere/registry, or the named refusal"
          env -u LIB PATH="/c/Windows/System32" ./target/debug/wolf.exe build --verbose corpus/hello.lu -o hello-plain.exe; echo "plain-shell exit=$? (0 = linked by discovery; 2 = the named refusal)"
          [ -f hello-plain.exe ] && ./hello-plain.exe
          echo "== no environment at all (env -i): what a learner never has"
          env -i SYSTEMROOT="$SYSTEMROOT" PATH="/c/Windows/System32" ./target/debug/wolf.exe build corpus/hello.lu -o hello-bare.exe; echo "env-i exit=$?"
          true

      - name: "T2 trap: the report and the exit number (D70 — 134 via ExitProcess)"
        run: |
          set +e
          for f in corpus/faults/*.lu; do
            [ -f "$f" ] || continue
            ./target/debug/wolf.exe build "$f" -o trap.exe 2>build.err
            if [ $? -ne 0 ]; then echo "$f: BUILD REFUSED: $(tr '\n' ' ' <build.err | cut -c1-200)"; continue; fi
            ./trap.exe >trap.out 2>trap.err; code=$?
            echo "$f: exit=$code stderr=[$(tr '\n' '|' <trap.err)]"
          done
          echo "== conform-run --native on a bounds trap"
          f=$(ls corpus/faults/*.lu | head -1)
          ./target/debug/wolf.exe conform-run "$f" --json --native; echo "exit=$?"

      - name: "T1 refusals by name: --release, and a task-layer row"
        run: |
          set +e
          echo "== wolf build --release corpus/hello.lu"
          ./target/debug/wolf.exe build --release corpus/hello.lu -o hello-rel.exe; echo "exit=$? (2 = named environment refusal)"
          f=$(grep -rl "spawn" corpus/conc/*.lu | head -1)
          echo "== wolf conform-run --json --native $f"
          ./target/debug/wolf.exe conform-run "$f" --json --native; echo "exit=$?"

      - name: "T3 corpus: lane-coverage --rows (per-row verdicts, the windows floor line)"
        run: cargo xtask lane-coverage --rows

      - name: "T3 corpus: xtask corpus (the ledger, as the unix lanes run it — informational at the bring-up)"
        continue-on-error: true
        run: cargo xtask corpus 2>&1 | tail -60

      - name: "T4 dist: cargo xtask dist (archive + the unpacked-archive smoke)"
        run: cargo xtask dist

      - name: "T5 tests: cargo test --workspace (what the gate-open makes execute here)"
        continue-on-error: true
        run: cargo test --workspace --no-fail-fast 2>&1 | grep -E -A10 "^(test result|test .*FAILED|---- |     Running)" | grep -vE "^\s*$|^--$" | head -400
