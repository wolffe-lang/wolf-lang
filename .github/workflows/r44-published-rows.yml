# The published 0.2.39 archives on hosted runners: wolf-lang's session and
# pty rows at v0.2.39 (corpus/os/session_rows.lu, corpus/os/pty_rows.lu),
# run by the archive each runner downloads, on macOS arm64 and on Linux
# x86-64 and aarch64. Each archive is fetched into its own new directory and
# hashed twice against the digest the release publishes. The version line
# must be bare. Each row is held to its own `//! check: run(...)` line on
# the checked, native and release tiers. A Linux runner first gets what the
# release workflow's run gate installs there (lld and clang-15) and builds the
# release tier through clang-15 as that gate does. Linux aarch64 is served by
# neither compiled tier yet: there, as in the run gate, native and release
# are held to their refusal by name (exit 2) and the checked tier to the rows.
#
# This workflow lives on its own branch and runs on a push to that branch
# alone. It reads the release and changes nothing.
name: published-rows

on:
  push:
    branches: [r44-published-rows]

permissions:
  contents: read

jobs:
  rows:
    name: published 0.2.39 rows (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, sha: 63de947671c240fc8be3e3480bb36321b0a6ac0b5e12e16bdae164d9050cfde0, lupin_sha: 7236424618f5bbf1e5f7693cd6333df90b715e1401b08b795668cbb1425ed5af }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, sha: 53f75d2b2dd79c0532b21920bc9f073098154aa0133caa2405209a1ef2af0457, lupin_sha: 61ce849eac0b531803e5bdf1fe07d91d3d69ecb57f83c5e7eb7c5d553cbef41b }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, sha: 390b6548d6bd8c7eac3ae0a1d09099437564418440de782caca45954463dd344, lupin_sha: 3a2b92423e53a6b539e30b8a4f055c09ccac30853f332da3305966550d1ac7d3 }
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: the published archive, read twice
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          WANT: ${{ matrix.sha }}
        run: |
          set -euo pipefail
          # The rows as they are at v0.2.39 (3fc86f77).
          shasum -a 256 -c - <<'SUMS'
          b950c1ec5eeb1cc8bb2549029af8def81fbddae7e77952c185c42ebb4c6d91c6  corpus/os/session_rows.lu
          3bcacf544bb848cfbb4674dbec93cb17f40c209e140d71b280e19dc471653c24  corpus/os/pty_rows.lu
          SUMS
          name=wolf-0.2.39-$TARGET.tar.gz
          d=$RUNNER_TEMP/published
          mkdir "$d"
          curl -fsSL --retry 3 -o "$d/$name" "https://github.com/wolffe-lang/wolf-lang/releases/download/v0.2.39/$name"
          a=$(shasum -a 256 "$d/$name" | cut -d' ' -f1)
          b=$(shasum -a 256 "$d/$name" | cut -d' ' -f1)
          echo "READ $name $a $b"
          test "$a" = "$WANT" && test "$b" = "$WANT"
          mkdir "$d/unpacked"
          tar -xzf "$d/$name" -C "$d/unpacked"
          echo "WOLF=$d/unpacked/wolf-0.2.39-$TARGET/wolf" >> "$GITHUB_ENV"
      # What the release workflow's own run gate installs on these runners
      # before it builds from the archive: the native linker and the release
      # tier's clang.
      - name: the native linker and the release tier's clang (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y lld clang-15
      - name: the version line
        shell: bash
        run: |
          set -euo pipefail
          "$WOLF" --version | tee "$RUNNER_TEMP/version.txt"
          grep -qx 'wolf 0.2.39 (wolfgang, pin 3fc86f7)' "$RUNNER_TEMP/version.txt"
          grep -qx 'paired with lupin 0.1.61 (reference interpreter), pin 5f1f1c949582f53121e4047bc83c86f23ff72240' "$RUNNER_TEMP/version.txt"
          if grep -q '+dev' "$RUNNER_TEMP/version.txt"; then echo "a +dev build"; exit 1; fi
      - name: the paired lupin 0.1.61 archive, read twice, and its version line
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          WANT: ${{ matrix.lupin_sha }}
        run: |
          set -euo pipefail
          name=lupin-0.1.61-$TARGET.tar.gz
          d=$RUNNER_TEMP/published-lupin
          mkdir "$d"
          curl -fsSL --retry 3 -o "$d/$name" "https://github.com/wolffe-lang/wolf-interp/releases/download/v0.1.61/$name"
          a=$(shasum -a 256 "$d/$name" | cut -d' ' -f1)
          b=$(shasum -a 256 "$d/$name" | cut -d' ' -f1)
          echo "READ $name $a $b"
          test "$a" = "$WANT" && test "$b" = "$WANT"
          mkdir "$d/unpacked"
          tar -xzf "$d/$name" -C "$d/unpacked"
          l=$(find "$d/unpacked" -type f -name lupin | head -1)
          "$l" --version | tee "$RUNNER_TEMP/lupin-version.txt"
          grep -qx 'lupin 0.1.61 (wolf-interp, reference interpreter at pin 5f1f1c9)' "$RUNNER_TEMP/lupin-version.txt"
      - name: the session and pty rows on three tiers
        shell: bash
        run: |
          set -uo pipefail
          unset WOLF_STD WOLF_RT_LIB
          if [ "$RUNNER_OS" = Linux ]; then export WOLF_CLANG=clang-15; fi
          python3 -I - "$WOLF" "$RUNNER_TEMP/rows" corpus/os/session_rows.lu corpus/os/pty_rows.lu <<'PY'
          import json, re, shutil, subprocess, sys
          from pathlib import Path
          import platform
          wolf, out, files = sys.argv[1], Path(sys.argv[2]), sys.argv[3:]
          # Linux aarch64: neither compiled tier is served yet; the answer owed is a refusal by name.
          refuses = platform.system() == "Linux" and platform.machine() == "aarch64"
          out.mkdir()
          bad = 0
          for f in files:
              src = Path(f)
              name = src.stem
              shutil.copy(src, out / src.name)
              m = re.search(r'^//! check: run\(exit=(\d+), stdout="(.*)"\)$', src.read_text(), re.M)
              want_exit, want = int(m[1]), m[2].encode().decode("unicode_escape") + "\n"
              got = {}
              p = subprocess.run([wolf, "conform-run", src.name, "--checked", "--json"], cwd=out, capture_output=True, text=True)
              try:
                  rec = json.loads(p.stdout)
                  got["checked"] = (rec["verdict"], rec["stdout_inline"])
              except ValueError:
                  got["checked"] = (f"conform-run exit {p.returncode}: {p.stderr[-300:]}", "")
              for tier, flags in (("native", []), ("release", ["--release"])):
                  exe = out / f"{name}.{tier}"
                  b = subprocess.run([wolf, "build", *flags, "--no-cache", src.name, "-o", str(exe)], cwd=out, capture_output=True, text=True)
                  if refuses:
                      said = b.stdout + b.stderr
                      ok = b.returncode == 2 and f"this host cannot run the {tier} tier" in said
                      print(f"{'ROW' if ok else 'FAIL'} {name} {tier} refused by name on Linux aarch64, exit {b.returncode}" + ("" if ok else f": {said[-2000:]}"))
                      bad += not ok
                      continue
                  if b.returncode != 0:
                      got[tier] = (f"build exit {b.returncode}: {(b.stdout + b.stderr)[-2000:]}", "")
                      continue
                  r = subprocess.run([str(exe)], cwd=out, capture_output=True, text=True)
                  got[tier] = (f"exit({r.returncode})", r.stdout)
              for tier, (verdict, stdout) in got.items():
                  ok = verdict == f"exit({want_exit})" and stdout == want
                  print(f"{'ROW' if ok else 'FAIL'} {name} {tier} {verdict} stdout {'equal to its check line' if ok else repr(stdout)}")
                  bad += not ok
          print(f"published rows: {'all' if not bad else bad} {'equal' if not bad else 'differ'}")
          sys.exit(1 if bad else 0)
          PY
